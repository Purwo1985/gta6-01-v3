<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="icon" href="data:,">
<title>IRON TIDE — Rustport</title>
<style>
  html,body{margin:0;padding:0;width:100%;height:100%;overflow:hidden;background:#0a0e14;
    font-family:"Segoe UI",Arial,Helvetica,sans-serif;color:#e8ecf1;}
  #gl{position:fixed;inset:0;display:block;}
  .hud{position:fixed;pointer-events:none;user-select:none;z-index:5;}
  #stars{top:14px;right:16px;font-size:30px;letter-spacing:4px;color:#ffb02e;
    text-shadow:0 0 8px rgba(0,0,0,.8);}
  #stars .off{color:rgba(255,255,255,.25);}
  #cash{top:52px;right:18px;font-size:22px;font-weight:700;color:#7dff9b;
    text-shadow:0 1px 3px #000;text-align:right;}
  #clock{top:82px;right:18px;font-size:14px;color:#cfe3ff;text-shadow:0 1px 2px #000;text-align:right;}
  #district{top:14px;left:16px;font-size:20px;font-weight:700;letter-spacing:1px;
    text-shadow:0 1px 4px #000;}
  #district small{display:block;font-size:12px;color:#9fd8ff;font-weight:400;letter-spacing:0;}
  #objective{top:64px;left:16px;max-width:340px;font-size:14px;line-height:1.45;
    background:rgba(8,12,20,.62);border-left:3px solid #ffb02e;padding:8px 10px;border-radius:0 6px 6px 0;}
  #objective b{color:#ffd27a;}
  #bars{left:16px;bottom:16px;font-size:13px;}
  .bar{width:210px;height:10px;background:rgba(0,0,0,.55);border:1px solid rgba(255,255,255,.35);
    border-radius:5px;margin:3px 0 7px;overflow:hidden;}
  .bar i{display:block;height:100%;}
  #hp i{background:#4ade80;} #arm i{background:#60a5fa;} #nos i{background:#f472b6;}
  #speed{right:18px;bottom:16px;text-align:right;}
  #speed b{font-size:42px;text-shadow:0 2px 6px #000;}
  #speed span{font-size:14px;color:#cfe3ff;}
  #weapon{right:18px;bottom:96px;text-align:right;font-size:15px;text-shadow:0 1px 3px #000;}
  #radio{left:16px;bottom:150px;font-size:13px;color:#ffd27a;text-shadow:0 1px 3px #000;}
  #sub{left:50%;bottom:120px;transform:translateX(-50%);max-width:640px;text-align:center;
    font-size:17px;line-height:1.5;text-shadow:0 1px 3px #000,0 0 12px #000;}
  #sub b{color:#ffd27a;}
  #toast{left:50%;top:120px;transform:translateX(-50%);font-size:18px;font-weight:700;
    color:#fff;text-shadow:0 1px 4px #000;background:rgba(8,12,20,.55);padding:6px 16px;border-radius:20px;}
  #minimap{position:fixed;left:16px;bottom:210px;width:190px;height:190px;border-radius:8px;
    border:2px solid rgba(255,255,255,.35);background:rgba(6,10,16,.72);z-index:5;}
  #screen{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;
    flex-direction:column;background:rgba(4,8,14,.72);z-index:10;text-align:center;padding:20px;}
  #screen h1{font-size:64px;margin:0;letter-spacing:6px;color:#ffb02e;
    text-shadow:0 0 24px rgba(255,140,0,.55),0 2px 0 #000;}
  #screen h2{font-size:18px;margin:6px 0 18px;color:#9fd8ff;letter-spacing:3px;font-weight:400;}
  #screen p{max-width:620px;line-height:1.6;font-size:15px;color:#dbe6f2;}
  #screen .keys{font-size:13px;color:#9fb4cc;line-height:1.9;}
  #screen button{pointer-events:auto;margin-top:18px;font-size:19px;padding:12px 34px;
    background:#ffb02e;color:#1a1206;border:0;border-radius:8px;font-weight:700;cursor:pointer;}
  #screen button:hover{background:#ffc95e;}
  #vignette{position:fixed;inset:0;pointer-events:none;z-index:4;
    background:radial-gradient(ellipse at center,transparent 58%,rgba(0,0,0,.5) 100%);}
  #dmg{position:fixed;inset:0;pointer-events:none;z-index:6;opacity:0;
    background:radial-gradient(ellipse at center,transparent 55%,rgba(255,0,0,.45) 100%);}
  .hidden{display:none !important;}
  body.menu-open .hud, body.menu-open #minimap{display:none !important;}
</style>
</head>
<body>
<canvas id="gl"></canvas>
<div id="vignette"></div><div id="dmg"></div>
<canvas id="minimap" width="190" height="190"></canvas>
<div class="hud" id="district">RUSTPORT<small>Portside · standing 0</small></div>
<div class="hud" id="objective"></div>
<div class="hud" id="stars"></div>
<div class="hud" id="cash">$0</div>
<div class="hud" id="clock">08:00 · CLEAR</div>
<div class="hud" id="bars">
  <div>HEALTH</div><div class="bar" id="hp"><i style="width:100%"></i></div>
  <div>ARMOUR</div><div class="bar" id="arm"><i style="width:0%"></i></div>
  <div>NOS</div><div class="bar" id="nos"><i style="width:100%"></i></div>
</div>
<div class="hud" id="weapon">FISTS</div>
<div class="hud" id="speed"><b>0</b> <span>MPH</span></div>
<div class="hud" id="radio">RADIO · RUST FM</div>
<div class="hud" id="sub"></div>
<div class="hud" id="toast"></div>
<div id="screen"></div>
<script type="importmap">{"imports":{"three":"./vendor/three.module.min.js"}}</script>
<script type="module" src="./src/main.js"></script>
</body>
</html>
